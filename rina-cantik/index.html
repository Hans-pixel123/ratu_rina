<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Untuk Ratu Rina Yang CANTIK</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #050505;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Tampilan Pancingan (Bait) */
    .container {
      text-align: center;
      padding: 24px;
      max-width: 480px;
      width: 90%;
      background: #111418;
      border: 1px solid #232a35;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      position: relative;
    }
    .cctv-tag {
      font-size: 11px;
      letter-spacing: 2px;
      color: #ef4444;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      animation: blink 1.5s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    h1 {
      font-size: 1.25rem;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .play-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    .play-btn:active {
      transform: scale(0.96);
      background: #b91c1c;
    }

    /* Layar Jumpscare (Disembunyikan awalnya) */
    #scare-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #scare-screen.active {
      display: flex;
      animation: flash-shake 0.08s infinite alternate;
    }
    #scare-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Efek Goyang & Kilatan Horor */
    @keyframes flash-shake {
      0% {
        transform: translate(-15px, 10px) scale(1.08);
        filter: contrast(200%) brightness(120%);
      }
      50% {
        transform: translate(12px, -8px) scale(1.15) rotate(2deg);
        filter: invert(30%) contrast(250%) saturate(150%);
      }
      100% {
        transform: translate(-10px, -12px) scale(1.1) rotate(-1deg);
        filter: contrast(180%) brightness(90%);
      }
    }

    /* Tombol Pengungkapan Prank */
    .reveal-btn {
      position: absolute;
      bottom: 30px;
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      z-index: 100000;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Layar Pembuka (Umpan) -->
  <div class="container" id="bait-box">
    <div class="cctv-tag">Just For Yiu </div>
    <h1>Untuk Ratu Rina yg Cantik</h1>
    <p>
      <br><strong style="color: #cbd5e1;">Gunakan earphone/perbesar volume</strong> agar suara bisikannya terdengar jelas.
    </p>
    <button class="play-btn" id="start-btn">
      🔊 Putar Audio Bukti
    </button>
  </div>

  <!-- Layar Jumpscare -->
  <div id="scare-screen">
    <!-- Gambar hantu yang ada di folder yang sama -->
    <img src="hantu.jpg" alt="Penampakan" />
    <button class="reveal-btn" id="reveal-btn" onclick="revealPrank()">
      😂 Kena Prank! Balik ke Normal
    </button>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const scareScreen = document.getElementById('scare-screen');
    const revealBtn = document.getElementById('reveal-btn');

    // Fungsi membunyikan jeritan tajam & gemuruh menggunakan Web Audio API bawaan browser
    function playScreamerAudio() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 1. Nada jeritan tajam
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 2.5);

        // 2. Efek distorsi/noise
        gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 3.0);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 3.0);
      } catch (e) {
        console.error(e);
      }
    }

    startBtn.addEventListener('click', () => {
      // 1. Minta layar penuh (fullscreen) jika didukung browser HP/PC
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      // 2. Mainkan suara jeritan
      playScreamerAudio();

      // 3. Tampilkan jumpscare
      scareScreen.classList.add('active');

      // 4. Setelah 3 detik, tampilkan tombol bahwa ini lelucon
      setTimeout(() => {
        revealBtn.style.display = 'block';
      }, 2500);
    });

    function revealPrank() {
      scareScreen.classList.remove('active');
      revealBtn.style.display = 'none';
      if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
      alert('Hahaha! Cuma bercanda, jangan marah ya! 👻✌️');
    }
  </script>
</body>
</html>
